[project]
name = "sourcelens-rag"
version = "1.0.0"
description = "A NotebookLM-style LangChain RAG application for Homework 2"
requires-python = ">=3.11"
dependencies = [
  "chainlit>=2.8,<3",
  "langchain-core>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "numpy>=2.0,<3",
  "pypdf>=6.0,<7",
  "python-docx>=1.2,<2",
  "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=4.0,<5"]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

