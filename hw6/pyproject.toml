[project]
name = "secure-notes-hw6"
version = "0.1.0"
description = "Prompt-generated private notes application for Homework 6"
requires-python = ">=3.13,<3.14"
dependencies = ["flask==3.1.3", "werkzeug==3.1.9"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
