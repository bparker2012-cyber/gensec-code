[project]
name = "secure-notes"
version = "1.0.0"
description = "A small, local Flask application for private notes and security checks"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.test-tmp"

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["app.py", "demo.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
