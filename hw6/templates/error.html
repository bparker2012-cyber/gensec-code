{% extends 'base.html' %}
{% block title %}{{ code }} · Secure Notes{% endblock %}
{% block content %}
<section class="error-page">
  <p class="eyebrow">{{ code }}</p>
  <h1>{{ name }}</h1>
  <p class="error" role="alert">{{ message }}</p>
  <a class="button" href="{{ url_for('index') }}">Return to Secure Notes</a>
</section>
{% endblock %}
